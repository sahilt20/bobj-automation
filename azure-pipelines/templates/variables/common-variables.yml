# Common Variables – BOBJ Raylight CI/CD

variables:
  artifactName: 'bobj-lcmbiar'
  artifactPath: '$(Build.ArtifactStagingDirectory)/lcmbiar'
  exportTimeout: 30
  importTimeout: 45
  validationTimeout: 15
  maxRetryAttempts: 3
  retryDelaySeconds: 30
  verboseLogging: true
  scriptsPath: '$(Build.SourcesDirectory)/scripts'
  powershellScriptsPath: '$(Build.SourcesDirectory)/scripts/powershell'
  pythonScriptsPath: '$(Build.SourcesDirectory)/scripts/python'
  configPath: '$(Build.SourcesDirectory)/config'
  raylightApiVersion: 'v1'
  raylightBasePath: '/biprws/raylight/v1'
  promotionBasePath: '/biprws/promotion'
  enableTeamsNotification: true
  enableEmailNotification: true
