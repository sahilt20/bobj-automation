# Validate Stage – LCMBIAR Package Validation

parameters:
  - name: artifactName
    type: string
  - name: runSecurityScan
    type: boolean
    default: true
  - name: checkDependencies
    type: boolean
    default: true
  - name: validateObjectCount
    type: boolean
    default: true

stages:
  - stage: Validate
    displayName: 'Validate LCMBIAR Package'
    dependsOn: []
    variables:
      - template: ../variables/common-variables.yml

    jobs:
      - job: ValidatePackage
        displayName: 'Validate LCMBIAR'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: $(validationTimeout)
        steps:
          - checkout: self
            clean: true
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: '${{ parameters.artifactName }}'
              targetPath: '$(Pipeline.Workspace)/lcmbiar'
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.10'
              addToPath: true
          - script: pip install -r $(pythonScriptsPath)/requirements.txt
            displayName: 'Install Dependencies'
          - task: PythonScript@0
            displayName: 'Validate Structure'
            inputs:
              scriptSource: 'filePath'
              scriptPath: '$(pythonScriptsPath)/lcmbiar_validator.py'
              arguments: >
                --input "$(Pipeline.Workspace)/lcmbiar"
                --check-structure --check-manifest
                --output "$(Build.ArtifactStagingDirectory)/validation-report.json"
          - ${{ if parameters.checkDependencies }}:
            - task: PythonScript@0
              displayName: 'Check Dependencies'
              inputs:
                scriptSource: 'filePath'
                scriptPath: '$(pythonScriptsPath)/lcmbiar_validator.py'
                arguments: >
                  --input "$(Pipeline.Workspace)/lcmbiar"
                  --check-dependencies --fail-on-missing
          - ${{ if parameters.runSecurityScan }}:
            - task: PowerShell@2
              displayName: 'Security Scan'
              inputs:
                targetType: 'inline'
                script: |
                  $patterns = @('password\s*[:=]', 'secret\s*[:=]', 'api[_-]?key\s*[:=]', 'connection[_-]?string\s*[:=]')
                  $violations = @()
                  Get-ChildItem -Path "$(Pipeline.Workspace)/lcmbiar" -Recurse -File | ForEach-Object {
                    $c = Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue
                    if ($c) { foreach ($p in $patterns) { if ($c -match $p) { $violations += "$($_.Name): $p" } } }
                  }
                  if ($violations.Count -gt 0) {
                    Write-Host "##vso[task.logissue type=warning]Sensitive data found"
                    $violations | ForEach-Object { Write-Host "  - $_" }
                  } else { Write-Host "Security scan passed" }
                pwsh: true
          - ${{ if parameters.validateObjectCount }}:
            - task: PowerShell@2
              displayName: 'Check Object Count'
              inputs:
                targetType: 'inline'
                script: |
                  $rpt = "$(Build.ArtifactStagingDirectory)/validation-report.json"
                  if (Test-Path $rpt) {
                    $r = Get-Content $rpt | ConvertFrom-Json
                    if ($r.objectCount -eq 0) { Write-Host "##vso[task.logissue type=error]Empty"; exit 1 }
                  }
                pwsh: true
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/validation-report.json'
              artifact: 'validation-report-$(Build.BuildId)'
              publishLocation: 'pipeline'
            condition: always()
