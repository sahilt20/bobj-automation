# Rollback Stage – Raylight Promotion API

parameters:
  - name: targetEnvironment
    type: string
  - name: backupArtifactName
    type: string
  - name: triggerCondition
    type: string
    default: 'failed()'
  - name: dependsOn
    type: object
    default: []
  - name: sendNotification
    type: boolean
    default: true

stages:
  - stage: Rollback_${{ parameters.targetEnvironment }}
    displayName: 'Rollback ${{ upper(parameters.targetEnvironment) }}'
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.triggerCondition }}
    variables:
      - template: ../variables/common-variables.yml
      - template: ../variables/environment-variables.yml
        parameters:
          environment: ${{ parameters.targetEnvironment }}

    jobs:
      - job: RollbackContent
        displayName: 'Rollback via Raylight'
        pool: $(agentPool)
        timeoutInMinutes: $(importTimeout)
        steps:
          - checkout: self
            clean: true
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: '${{ parameters.backupArtifactName }}'
              targetPath: '$(Pipeline.Workspace)/backup'
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: $(serviceConnectionName)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: 'bobj-username,bobj-password'
              RunAsPreJob: true
          - task: PowerShell@2
            displayName: 'Execute Rollback'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Invoke-BOBJRollback.ps1'
              arguments: >
                -ServerUrl "$(bobjServerUrl)" -CmsServer "$(bobjCmsServer)"
                -Username "$(bobj-username)" -Password "$(bobj-password)"
                -AuthType "$(bobjAuthType)" -BackupPath "$(Pipeline.Workspace)/backup"
                -VerboseLogging:$(verboseLogging)
              pwsh: true
          - task: PowerShell@2
            displayName: 'Verify Rollback'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Validate-LCMBIARPackage.ps1'
              arguments: >
                -VerifyDeployment -ServerUrl "$(bobjServerUrl)"
                -CmsServer "$(bobjCmsServer)" -Username "$(bobj-username)"
                -Password "$(bobj-password)" -AuthType "$(bobjAuthType)"
              pwsh: true
          - ${{ if parameters.sendNotification }}:
            - task: PowerShell@2
              displayName: 'Rollback Notification'
              inputs:
                targetType: 'inline'
                script: |
                  $wh = $env:TEAMS_WEBHOOK_URL
                  if ($wh) {
                    $body = @{ "@type"="MessageCard"; "themeColor"="FF0000"; "summary"="Rollback"
                      "sections"=@(@{ "activityTitle"="BOBJ Rollback"; "text"="${{ parameters.targetEnvironment }} rolled back" })
                    } | ConvertTo-Json -Depth 5
                    Invoke-RestMethod -Uri $wh -Method Post -Body $body -ContentType 'application/json'
                  }
                pwsh: true
              env:
                TEAMS_WEBHOOK_URL: $(teamsWebhookUrl)
              continueOnError: true
