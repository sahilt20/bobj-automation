# Deploy Stage – Raylight Promotion API
# Imports LCMBIAR via POST /biprws/promotion/ with approval gates

parameters:
  - name: targetEnvironment
    type: string
  - name: dependsOn
    type: object
    default: []
  - name: artifactName
    type: string
  - name: conflictResolution
    type: string
    default: 'UpdateExisting'
  - name: overwriteSecurity
    type: boolean
    default: false
  - name: createBackup
    type: boolean
    default: true
  - name: requireApproval
    type: boolean
    default: false
  - name: minimumApprovers
    type: number
    default: 1

stages:
  - stage: Deploy_${{ parameters.targetEnvironment }}
    displayName: 'Deploy to ${{ upper(parameters.targetEnvironment) }}'
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    variables:
      - template: ../variables/common-variables.yml
      - template: ../variables/environment-variables.yml
        parameters:
          environment: ${{ parameters.targetEnvironment }}

    jobs:
      - ${{ if parameters.requireApproval }}:
        - job: WaitForApproval
          displayName: 'Awaiting Approval'
          pool: server
          timeoutInMinutes: $(approvalTimeout)
          steps:
            - task: ManualValidation@0
              displayName: 'Approve ${{ upper(parameters.targetEnvironment) }}'
              inputs:
                instructions: |
                  Approve LCMBIAR deployment to ${{ upper(parameters.targetEnvironment) }}.
                  Build: $(Build.BuildNumber) | Conflict: ${{ parameters.conflictResolution }}

      - job: PreDeployHealthCheck
        displayName: 'Raylight Health Check'
        ${{ if parameters.requireApproval }}:
          dependsOn: WaitForApproval
        pool: $(agentPool)
        timeoutInMinutes: 5
        steps:
          - checkout: self
            clean: true
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: $(serviceConnectionName)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: 'bobj-username,bobj-password'
              RunAsPreJob: true
          - task: PowerShell@2
            displayName: 'Check Raylight API'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Get-BOBJConnection.ps1'
              arguments: >
                -ServerUrl "$(bobjServerUrl)" -CmsServer "$(bobjCmsServer)"
                -CmsPort $(bobjCmsPort) -Username "$(bobj-username)"
                -Password "$(bobj-password)" -AuthType "$(bobjAuthType)"
              pwsh: true

      - ${{ if parameters.createBackup }}:
        - job: CreateBackup
          displayName: 'Pre-Deployment Backup'
          dependsOn: PreDeployHealthCheck
          pool: $(agentPool)
          timeoutInMinutes: $(exportTimeout)
          steps:
            - checkout: self
              clean: true
            - task: AzureKeyVault@2
              inputs:
                azureSubscription: $(serviceConnectionName)
                KeyVaultName: $(keyVaultName)
                SecretsFilter: 'bobj-username,bobj-password'
                RunAsPreJob: true
            - task: PowerShell@2
              displayName: 'Backup via Raylight Export'
              inputs:
                targetType: 'filePath'
                filePath: '$(powershellScriptsPath)/Export-BOBJContent.ps1'
                arguments: >
                  -ServerUrl "$(bobjServerUrl)" -CmsServer "$(bobjCmsServer)"
                  -CmsPort $(bobjCmsPort) -Username "$(bobj-username)"
                  -Password "$(bobj-password)" -AuthType "$(bobjAuthType)"
                  -ExportFolder "/Public Folders" -OutputPath "$(Build.ArtifactStagingDirectory)/backup"
                  -BackupMode -IncludeSecurityRights -IncludeDependencies
                pwsh: true
            - task: PublishPipelineArtifact@1
              inputs:
                targetPath: '$(Build.ArtifactStagingDirectory)/backup'
                artifact: 'backup-${{ parameters.targetEnvironment }}-$(Build.BuildId)'
                publishLocation: 'pipeline'

      - job: ImportContent
        displayName: 'Import LCMBIAR via Raylight'
        dependsOn:
          - PreDeployHealthCheck
          - ${{ if parameters.createBackup }}:
            - CreateBackup
        pool: $(agentPool)
        timeoutInMinutes: $(importTimeout)
        steps:
          - checkout: self
            clean: true
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: 'current'
              artifactName: '${{ parameters.artifactName }}'
              targetPath: '$(Pipeline.Workspace)/lcmbiar'
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: $(serviceConnectionName)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: 'bobj-username,bobj-password'
              RunAsPreJob: true
          - task: PowerShell@2
            displayName: 'Import via Promotion API'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Import-BOBJContent.ps1'
              arguments: >
                -ServerUrl "$(bobjServerUrl)" -CmsServer "$(bobjCmsServer)"
                -CmsPort $(bobjCmsPort) -Username "$(bobj-username)"
                -Password "$(bobj-password)" -AuthType "$(bobjAuthType)"
                -LcmbiarPath "$(Pipeline.Workspace)/lcmbiar"
                -ConflictResolution "${{ parameters.conflictResolution }}"
                -OverwriteSecurity:$${{ parameters.overwriteSecurity }}
                -VerboseLogging:$(verboseLogging)
              pwsh: true

      - job: VerifyDeployment
        displayName: 'Post-Deploy Verification'
        dependsOn: ImportContent
        pool: $(agentPool)
        timeoutInMinutes: 10
        steps:
          - checkout: self
            clean: true
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: $(serviceConnectionName)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: 'bobj-username,bobj-password'
              RunAsPreJob: true
          - task: PowerShell@2
            displayName: 'Raylight Verification'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Validate-LCMBIARPackage.ps1'
              arguments: >
                -VerifyDeployment -ServerUrl "$(bobjServerUrl)"
                -CmsServer "$(bobjCmsServer)" -Username "$(bobj-username)"
                -Password "$(bobj-password)" -AuthType "$(bobjAuthType)"
                -OutputPath "$(Build.ArtifactStagingDirectory)/verify.json"
              pwsh: true
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/verify.json'
              artifact: 'verify-${{ parameters.targetEnvironment }}-$(Build.BuildId)'
              publishLocation: 'pipeline'
            condition: always()
