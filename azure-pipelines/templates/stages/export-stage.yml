# Export Stage – Raylight Promotion API
# Exports BOBJ content to LCMBIAR via POST /biprws/promotion/

parameters:
  - name: sourceEnvironment
    type: string
  - name: exportFolder
    type: string
    default: '/Public Folders'
  - name: includeSecurityRights
    type: boolean
    default: true
  - name: includeDependencies
    type: boolean
    default: true
  - name: includeConnections
    type: boolean
    default: true
  - name: dryRun
    type: boolean
    default: false

stages:
  - stage: Export
    displayName: 'Export LCMBIAR via Raylight'
    dependsOn: []
    variables:
      - template: ../variables/common-variables.yml
      - template: ../variables/environment-variables.yml
        parameters:
          environment: ${{ parameters.sourceEnvironment }}

    jobs:
      - job: ExportContent
        displayName: 'Export BOBJ Content'
        pool: $(agentPool)
        timeoutInMinutes: $(exportTimeout)
        steps:
          - checkout: self
            clean: true

          - task: AzureKeyVault@2
            displayName: 'Fetch Credentials'
            inputs:
              azureSubscription: $(serviceConnectionName)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: 'bobj-username,bobj-password'
              RunAsPreJob: true

          - task: PowerShell@2
            displayName: 'Raylight Health Check'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Get-BOBJConnection.ps1'
              arguments: >
                -ServerUrl "$(bobjServerUrl)"
                -CmsServer "$(bobjCmsServer)"
                -CmsPort $(bobjCmsPort)
                -Username "$(bobj-username)"
                -Password "$(bobj-password)"
                -AuthType "$(bobjAuthType)"
              pwsh: true

          - task: PowerShell@2
            displayName: 'Export via Promotion API'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Export-BOBJContent.ps1'
              arguments: >
                -ServerUrl "$(bobjServerUrl)"
                -CmsServer "$(bobjCmsServer)"
                -CmsPort $(bobjCmsPort)
                -Username "$(bobj-username)"
                -Password "$(bobj-password)"
                -AuthType "$(bobjAuthType)"
                -ExportFolder "${{ parameters.exportFolder }}"
                -OutputPath "$(artifactPath)"
                -IncludeSecurityRights:$${{ parameters.includeSecurityRights }}
                -IncludeDependencies:$${{ parameters.includeDependencies }}
                -IncludeConnections:$${{ parameters.includeConnections }}
                -DryRun:$${{ parameters.dryRun }}
                -VerboseLogging:$(verboseLogging)
              pwsh: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish LCMBIAR'
            inputs:
              targetPath: '$(artifactPath)'
              artifact: '$(artifactName)'
              publishLocation: 'pipeline'
            condition: and(succeeded(), eq('${{ parameters.dryRun }}', 'false'))
