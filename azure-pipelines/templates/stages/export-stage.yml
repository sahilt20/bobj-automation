# Export Stage Template for BOBJ Content
# Exports BusinessObjects content to LCMBIAR archive using LCMCLI

parameters:
  - name: sourceEnvironment
    type: string
    default: 'dev'
  - name: exportObjects
    type: object
    default: []
  - name: exportFolder
    type: string
    default: '/Public Folders'
  - name: includeSecurityRights
    type: boolean
    default: true
  - name: includeDependencies
    type: boolean
    default: true

stages:
  - stage: Export_${{ parameters.sourceEnvironment }}
    displayName: 'Export from ${{ upper(parameters.sourceEnvironment) }}'
    variables:
      - template: ../variables/common-variables.yml
      - template: ../variables/environment-variables.yml
        parameters:
          environment: ${{ parameters.sourceEnvironment }}
    
    jobs:
      - job: ExportContent
        displayName: 'Export BOBJ Content'
        pool: $(agentPool)
        timeoutInMinutes: $(exportTimeout)
        
        steps:
          - checkout: self
            clean: true
            
          - task: PowerShell@2
            displayName: 'Test BOBJ Connection'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Get-BOBJConnection.ps1'
              arguments: >
                -ServerUrl "$(bobjServerUrl)"
                -CmsServer "$(bobjCmsServer)"
                -CmsPort "$(bobjCmsPort)"
                -Username "$(bobj-username)"
                -Password "$(bobj-password)"
                -AuthType "$(bobjAuthType)"
              pwsh: true
              
          - task: PowerShell@2
            displayName: 'Export BOBJ Content to LCMBIAR'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Export-BOBJContent.ps1'
              arguments: >
                -CmsServer "$(bobjCmsServer)"
                -CmsPort "$(bobjCmsPort)"
                -Username "$(bobj-username)"
                -Password "$(bobj-password)"
                -AuthType "$(bobjAuthType)"
                -ExportFolder "${{ parameters.exportFolder }}"
                -OutputPath "$(artifactPath)"
                -IncludeSecurityRights:$${{ parameters.includeSecurityRights }}
                -VerboseLogging:$(verboseLogging)
              pwsh: true
            env:
              BOBJ_OBJECTS: '${{ convertToJson(parameters.exportObjects) }}'
              
          - task: PublishPipelineArtifact@1
            displayName: 'Publish LCMBIAR Artifact'
            inputs:
              targetPath: '$(artifactPath)'
              artifact: '$(artifactName)-$(Build.BuildId)'
              publishLocation: 'pipeline'
              
          - task: PowerShell@2
            displayName: 'Generate Export Report'
            inputs:
              targetType: 'inline'
              script: |
                $exportReport = @{
                  BuildId = "$(Build.BuildId)"
                  SourceEnvironment = "${{ parameters.sourceEnvironment }}"
                  ExportFolder = "${{ parameters.exportFolder }}"
                  Timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
                  ArtifactName = "$(artifactName)-$(Build.BuildId)"
                }
                $exportReport | ConvertTo-Json | Out-File "$(artifactPath)/export-report.json"
                Write-Host "##vso[task.setvariable variable=exportReportPath]$(artifactPath)/export-report.json"
              pwsh: true
