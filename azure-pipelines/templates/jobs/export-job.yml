# Job Template: Export BOBJ Content
# Reusable job for exporting BOBJ content to LCMBIAR

parameters:
  - name: cmsServer
    type: string
  - name: cmsPort
    type: string
    default: '6400'
  - name: authType
    type: string
    default: 'secEnterprise'
  - name: exportFolder
    type: string
    default: '/Public Folders'
  - name: outputPath
    type: string
  - name: includeSecurityRights
    type: boolean
    default: true
  - name: agentPool
    type: string
    default: 'Default'

# NOTE: Credentials (bobj-username, bobj-password) must be provided via
# a Variable Group linked at the pipeline level. See environment-variables.yml.

jobs:
  - job: ExportBOBJContent
    displayName: 'Export BOBJ Content Job'
    pool: ${{ parameters.agentPool }}
    
    steps:
      - task: PowerShell@2
        displayName: 'Export BOBJ Content'
        inputs:
          targetType: 'filePath'
          filePath: '$(Build.SourcesDirectory)/scripts/powershell/Export-BOBJContent.ps1'
          arguments: >
            -CmsServer "${{ parameters.cmsServer }}"
            -CmsPort "${{ parameters.cmsPort }}"
            -Username "$(bobj-username)"
            -Password "$(bobj-password)"
            -AuthType "${{ parameters.authType }}"
            -ExportFolder "${{ parameters.exportFolder }}"
            -OutputPath "${{ parameters.outputPath }}"
            -IncludeSecurityRights:$${{ parameters.includeSecurityRights }}
          pwsh: true
