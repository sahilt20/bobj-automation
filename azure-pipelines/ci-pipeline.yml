# ============================================================================
# SAP BusinessObjects CI Pipeline – Raylight REST API
# ============================================================================
# Exports LCMBIAR content from DEV, validates, and publishes artifacts.
#
# Raylight API endpoints used:
#   /biprws/logon/long          – Authentication
#   /biprws/raylight/v1/about   – Server health check
#   /biprws/infostore/folder    – Folder resolution
#   /biprws/promotion/          – LCM Promotion Management (export)
#   /biprws/logoff              – Session cleanup
# ============================================================================

trigger:
  branches:
    include:
      - main
      - develop
      - release/*
  paths:
    include:
      - config/**
      - scripts/**
    exclude:
      - docs/**
      - '*.md'

pr:
  branches:
    include:
      - main
      - develop

parameters:
  - name: sourceEnvironment
    displayName: 'Source BOBJ Environment'
    type: string
    default: 'dev'
    values: ['dev', 'qa', 'prod']

  - name: exportFolder
    displayName: 'BOBJ Folder to Export'
    type: string
    default: '/Public Folders'

  - name: includeSecurityRights
    displayName: 'Include Security/ACL Settings'
    type: boolean
    default: true

  - name: includeDependencies
    displayName: 'Include Dependent Objects'
    type: boolean
    default: true

  - name: includeConnections
    displayName: 'Include Data Connections'
    type: boolean
    default: true

  - name: runSecurityScan
    displayName: 'Run Security Scan on Package'
    type: boolean
    default: true

  - name: dryRun
    displayName: 'Dry Run (test only, no export)'
    type: boolean
    default: false

variables:
  - template: templates/variables/common-variables.yml
  - template: templates/variables/environment-variables.yml
    parameters:
      environment: ${{ parameters.sourceEnvironment }}

stages:
  # ── Stage 1: Raylight Health Check ──────────────────────────────────────
  - stage: HealthCheck
    displayName: 'Raylight API Health Check'
    jobs:
      - job: CheckConnection
        displayName: 'Verify BOBJ Raylight API'
        pool: $(agentPool)
        timeoutInMinutes: 5
        steps:
          - checkout: self
            clean: true

          - task: AzureKeyVault@2
            displayName: 'Fetch Credentials from Key Vault'
            inputs:
              azureSubscription: $(serviceConnectionName)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: 'bobj-username,bobj-password'
              RunAsPreJob: true

          - task: PowerShell@2
            displayName: 'Raylight Connection Health Check'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Get-BOBJConnection.ps1'
              arguments: >
                -ServerUrl "$(bobjServerUrl)"
                -CmsServer "$(bobjCmsServer)"
                -CmsPort $(bobjCmsPort)
                -Username "$(bobj-username)"
                -Password "$(bobj-password)"
                -AuthType "$(bobjAuthType)"
              pwsh: true

  # ── Stage 2: Export via Raylight Promotion API ──────────────────────────
  - stage: Export
    displayName: 'Export LCMBIAR via Raylight'
    dependsOn: HealthCheck
    condition: succeeded()
    jobs:
      - template: templates/jobs/export-job.yml
        parameters:
          serverUrl: $(bobjServerUrl)
          cmsServer: $(bobjCmsServer)
          cmsPort: $(bobjCmsPort)
          keyVaultName: $(keyVaultName)
          serviceConnectionName: $(serviceConnectionName)
          authType: $(bobjAuthType)
          exportFolder: ${{ parameters.exportFolder }}
          includeSecurityRights: ${{ parameters.includeSecurityRights }}
          includeDependencies: ${{ parameters.includeDependencies }}
          includeConnections: ${{ parameters.includeConnections }}
          dryRun: ${{ parameters.dryRun }}
          outputPath: '$(artifactPath)'
          agentPool: $(agentPool)

  # ── Stage 3: Validate LCMBIAR Package ───────────────────────────────────
  - stage: Validate
    displayName: 'Validate LCMBIAR Package'
    dependsOn: Export
    condition: and(succeeded(), eq('${{ parameters.dryRun }}', 'false'))
    jobs:
      - template: templates/jobs/validate-job.yml
        parameters:
          artifactName: $(artifactName)
          runSecurityScan: ${{ parameters.runSecurityScan }}
          checkDependencies: ${{ parameters.includeDependencies }}
          validateObjectCount: true

  # ── Stage 4: Publish Build Summary ──────────────────────────────────────
  - stage: Publish
    displayName: 'Publish Build Summary'
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: PublishSummary
        displayName: 'Generate & Publish Summary'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 5
        steps:
          - task: PowerShell@2
            displayName: 'Generate Build Summary'
            inputs:
              targetType: 'inline'
              script: |
                $summary = @{
                  buildId = "$(Build.BuildId)"
                  buildNumber = "$(Build.BuildNumber)"
                  pipeline = "$(Build.DefinitionName)"
                  sourceBranch = "$(Build.SourceBranch)"
                  sourceVersion = "$(Build.SourceVersion)"
                  sourceEnvironment = "${{ parameters.sourceEnvironment }}"
                  exportFolder = "${{ parameters.exportFolder }}"
                  timestamp = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
                  raylightApiVersion = "v1"
                  dryRun = $${{ parameters.dryRun }}
                  status = "success"
                }
                $summary | ConvertTo-Json -Depth 3 | Out-File "$(Build.ArtifactStagingDirectory)/build-summary.json"
              pwsh: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Build Summary'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/build-summary.json'
              artifact: 'build-summary-$(Build.BuildId)'
              publishLocation: 'pipeline'

  # ── Stage 5: Notifications ──────────────────────────────────────────────
  - stage: Notify
    displayName: 'Send Notifications'
    dependsOn:
      - Export
      - Validate
      - Publish
    condition: always()
    jobs:
      - template: templates/jobs/notification-job.yml
        parameters:
          messageType: $[ stageDependencies.Validate.ValidatePackage.result ]
          title: 'BOBJ CI Pipeline – $(Build.BuildNumber)'
          environment: ${{ parameters.sourceEnvironment }}
          pipelineName: '$(Build.DefinitionName)'
