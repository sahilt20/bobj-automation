# ============================================================================
# SAP BusinessObjects CD Pipeline – Raylight REST API
# ============================================================================
# Deploys LCMBIAR content across environments: DEV -> QA -> PROD
#
# Production features:
#   - Raylight /about health checks before every deployment
#   - SHA256 artifact integrity verification
#   - Pre-deployment backups via Promotion API export
#   - Multi-approver gates for QA and PROD
#   - PROD deployment window enforcement (Mon-Thu 06:00-18:00 UTC)
#   - Automatic rollback on failure via Promotion API import
#   - Post-deployment verification via Raylight + InfoStore APIs
#   - Teams + Email notifications
# ============================================================================

trigger: none

resources:
  pipelines:
    - pipeline: ciPipeline
      source: 'BOBJ-CI-Pipeline'
      trigger:
        branches:
          include:
            - main
            - release/*

parameters:
  - name: sourceArtifact
    displayName: 'Source Pipeline Artifact'
    type: string
    default: 'bobj-lcmbiar'

  - name: targetEnvironments
    displayName: 'Target Environments'
    type: object
    default:
      - dev
      - qa
      - prod

  - name: conflictResolution
    displayName: 'Conflict Resolution Strategy'
    type: string
    default: 'UpdateExisting'
    values: ['UpdateExisting', 'SkipExisting', 'RenameNew', 'Fail']

  - name: overwriteSecurity
    displayName: 'Overwrite Security on Target'
    type: boolean
    default: false

  - name: createBackup
    displayName: 'Create Pre-Deployment Backup'
    type: boolean
    default: true

  - name: enableRollback
    displayName: 'Enable Automatic Rollback on Failure'
    type: boolean
    default: true

  - name: skipDev
    displayName: 'Skip DEV (already deployed)'
    type: boolean
    default: false

variables:
  - template: templates/variables/common-variables.yml

stages:
  # ── Stage 1: Pre-Deployment Validation ──────────────────────────────────
  - stage: PreDeployment
    displayName: 'Pre-Deployment Validation'
    jobs:
      - job: ValidateArtifact
        displayName: 'Validate CI Artifact'
        pool:
          vmImage: 'ubuntu-latest'
        timeoutInMinutes: 10
        steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: 'Download LCMBIAR Artifact'
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProjectId)'
              definition: '$(resources.pipeline.ciPipeline.pipelineID)'
              buildVersionToDownload: 'latest'
              artifactName: '${{ parameters.sourceArtifact }}'
              targetPath: '$(Pipeline.Workspace)/lcmbiar'

          - task: PowerShell@2
            displayName: 'Validate Package Integrity'
            inputs:
              targetType: 'filePath'
              filePath: '$(powershellScriptsPath)/Validate-LCMBIARPackage.ps1'
              arguments: >
                -LcmbiarPath "$(Pipeline.Workspace)/lcmbiar"
                -OutputPath "$(Build.ArtifactStagingDirectory)/pre-deploy-validation.json"
              pwsh: true

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Validation Report'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/pre-deploy-validation.json'
              artifact: 'pre-deploy-validation-$(Build.BuildId)'
              publishLocation: 'pipeline'
            condition: always()

  # ── Stage 2: Deploy to DEV ──────────────────────────────────────────────
  - ${{ if not(parameters.skipDev) }}:
    - template: templates/stages/deploy-stage.yml
      parameters:
        targetEnvironment: 'dev'
        dependsOn: ['PreDeployment']
        artifactName: ${{ parameters.sourceArtifact }}
        conflictResolution: ${{ parameters.conflictResolution }}
        overwriteSecurity: ${{ parameters.overwriteSecurity }}
        createBackup: false
        requireApproval: false

  # ── Stage 3: Deploy to QA ──────────────────────────────────────────────
  - ${{ if containsValue(parameters.targetEnvironments, 'qa') }}:
    - template: templates/stages/deploy-stage.yml
      parameters:
        targetEnvironment: 'qa'
        dependsOn:
          - ${{ if not(parameters.skipDev) }}:
            - Deploy_dev
          - ${{ if parameters.skipDev }}:
            - PreDeployment
        artifactName: ${{ parameters.sourceArtifact }}
        conflictResolution: ${{ parameters.conflictResolution }}
        overwriteSecurity: ${{ parameters.overwriteSecurity }}
        createBackup: ${{ parameters.createBackup }}
        requireApproval: true

    - ${{ if parameters.enableRollback }}:
      - template: templates/stages/rollback-stage.yml
        parameters:
          targetEnvironment: 'qa'
          backupArtifactName: 'backup-qa-$(Build.BuildId)'
          dependsOn: ['Deploy_qa']
          triggerCondition: failed()

  # ── Stage 4: Deploy to PROD ────────────────────────────────────────────
  - ${{ if containsValue(parameters.targetEnvironments, 'prod') }}:
    - stage: ProdPreChecks
      displayName: 'PROD Pre-Deployment Checks'
      dependsOn:
        - ${{ if containsValue(parameters.targetEnvironments, 'qa') }}:
          - Deploy_qa
        - ${{ if not(containsValue(parameters.targetEnvironments, 'qa')) }}:
          - PreDeployment
      jobs:
        - job: DeploymentWindowCheck
          displayName: 'Verify PROD Deployment Window'
          pool:
            vmImage: 'ubuntu-latest'
          steps:
            - task: PowerShell@2
              displayName: 'Check PROD Deployment Window'
              inputs:
                targetType: 'inline'
                script: |
                  $now = [System.DateTime]::UtcNow
                  $hour = $now.Hour
                  $day = $now.DayOfWeek
                  Write-Host "UTC: $($now.ToString('yyyy-MM-dd HH:mm:ss')) ($day)"
                  $allowedDays = @('Monday','Tuesday','Wednesday','Thursday')
                  $dayOk = $day.ToString() -in $allowedDays
                  $hourOk = ($hour -ge 6) -and ($hour -lt 18)
                  if ($dayOk -and $hourOk) {
                    Write-Host "##vso[task.complete result=Succeeded;]Window OPEN"
                  } else {
                    Write-Host "##vso[task.logissue type=error]PROD blocked – outside Mon-Thu 06:00-18:00 UTC"
                    exit 1
                  }
                pwsh: true

    - template: templates/stages/deploy-stage.yml
      parameters:
        targetEnvironment: 'prod'
        dependsOn: ['ProdPreChecks']
        artifactName: ${{ parameters.sourceArtifact }}
        conflictResolution: ${{ parameters.conflictResolution }}
        overwriteSecurity: ${{ parameters.overwriteSecurity }}
        createBackup: true
        requireApproval: true
        minimumApprovers: 2

    - ${{ if parameters.enableRollback }}:
      - template: templates/stages/rollback-stage.yml
        parameters:
          targetEnvironment: 'prod'
          backupArtifactName: 'backup-prod-$(Build.BuildId)'
          dependsOn: ['Deploy_prod']
          triggerCondition: failed()

  # ── Stage 5: Summary & Notifications ───────────────────────────────────
  - stage: Summary
    displayName: 'Deployment Summary'
    dependsOn:
      - PreDeployment
      - ${{ if not(parameters.skipDev) }}:
        - Deploy_dev
      - ${{ if containsValue(parameters.targetEnvironments, 'qa') }}:
        - Deploy_qa
      - ${{ if containsValue(parameters.targetEnvironments, 'prod') }}:
        - Deploy_prod
    condition: always()
    jobs:
      - job: GenerateSummary
        displayName: 'Deployment Report'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: PowerShell@2
            displayName: 'Generate Report'
            inputs:
              targetType: 'inline'
              script: |
                @{
                  buildId = "$(Build.BuildId)"
                  pipeline = "$(Build.DefinitionName)"
                  timestamp = (Get-Date -Format 'yyyy-MM-ddTHH:mm:ssZ')
                  conflictResolution = "${{ parameters.conflictResolution }}"
                  raylightApiVersion = "v1"
                  targetEnvironments = @("${{ join('","', parameters.targetEnvironments) }}")
                } | ConvertTo-Json -Depth 3 | Out-File "$(Build.ArtifactStagingDirectory)/deployment-summary.json"
              pwsh: true

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/deployment-summary.json'
              artifact: 'deployment-summary-$(Build.BuildId)'
              publishLocation: 'pipeline'

      - template: templates/jobs/notification-job.yml
        parameters:
          messageType: 'info'
          title: 'BOBJ CD – $(Build.BuildNumber)'
          environment: 'all'
          pipelineName: '$(Build.DefinitionName)'
